[package]
name = "rust_bot"
version = "0.2.0"
edition = "2024"
description = "An intelligent GitHub repository resolver built in Rust with search, ranking, fuzzy matching, and confidence scoring."

[dependencies]
env = "1.0.1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
